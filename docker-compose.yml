services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${ERMS_SQLSERVER_SA_PASSWORD:?ERMS_SQLSERVER_SA_PASSWORD must be set}"
    ports:
      - "1433:1433"
    volumes:
      - erms_sql_data:/var/opt/mssql
volumes:
  erms_sql_data:
